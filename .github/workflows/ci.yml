name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build unsigned iOS
        continue-on-error: true
        if: runner.os == 'macOS'
        run:  |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only
          echo "Building Runner.app with xcodebuild without signing..."
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
        shell: bash

      - name: Build Android
        continue-on-error: true
        if: runner.os == 'Linux'
        run: flutter build apk --debug --target-platform android-arm64

      - name: Flutter test
        continue-on-error: true
        run: flutter test

      - name: Flutter analyze
        run: flutter analyze

      - name: Upload resolved dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-${{ runner.os }}
          path: pubspec.lock
