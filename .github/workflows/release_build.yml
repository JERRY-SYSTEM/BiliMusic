name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要创建并发布的新 Git tag，例如 v1.2.3'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_env:
    name: Prepare version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Generate version from input tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION_NAME="${INPUT_TAG#v}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be a valid app version, for example v1.2.3 or 1.2.3."
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${INPUT_TAG}"; then
            echo "Tag ${INPUT_TAG} already exists. Enter a new tag."
            exit 1
          fi

          BUILD_NUMBER="$(git rev-list --count HEAD)"
          FULL_VERSION="${VERSION_NAME}+${BUILD_NUMBER}"

          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "FULL_VERSION=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          printf 'VERSION_NAME=%s\nBUILD_NUMBER=%s\nFULL_VERSION=%s\n' \
            "$VERSION_NAME" "$BUILD_NUMBER" "$FULL_VERSION" > _build_env.config

          sed -i "s/^version: .*/version: ${FULL_VERSION}/" pubspec.yaml
          grep "^version: ${FULL_VERSION}$" pubspec.yaml

      - name: Upload build environment
        uses: actions/upload-artifact@v4
        with:
          name: build_env_files
          path: |
            pubspec.yaml
            _build_env.config

  build_app:
    name: Build ${{ matrix.name }}
    needs: build_env
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ios-unsigned
            os: macos-latest
          - name: android-arm64-v8a
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download build environment
        uses: actions/download-artifact@v4
        with:
          name: build_env_files

      - name: Read build environment
        shell: bash
        run: cat _build_env.config >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        if: matrix.name == 'ios-unsigned'
        shell: bash
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define="APP_VERSION=$VERSION_NAME"

          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r9 "bilibeat-${{ inputs.tag }}-ios-unsigned.ipa" Payload

      - name: Build Android arm64-v8a APK
        if: matrix.name == 'android-arm64-v8a'
        shell: bash
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define="APP_VERSION=$VERSION_NAME"

      - name: Install Android build tools 33.0.0
        if: matrix.name == 'android-arm64-v8a'
        shell: bash
        run: |
          yes | sdkmanager "build-tools;33.0.0" >/dev/null || true
          test -x "$ANDROID_HOME/build-tools/33.0.0/apksigner"

      - name: Sign Android APK
        if: matrix.name == 'android-arm64-v8a'
        shell: bash
        run: |
          if [ ! -f android/sign.p12 ]; then
            echo "android/sign.p12 is missing from the checked-out commit."
            exit 1
          fi

          mkdir -p build/artifacts
          APKSIGNER="$ANDROID_HOME/build-tools/33.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks android/sign.p12 \
            --ks-key-alias key0 \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --out "build/artifacts/bilibeat-${{ inputs.tag }}-arm64-v8a.apk" \
            build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --verbose \
            "build/artifacts/bilibeat-${{ inputs.tag }}-arm64-v8a.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifact
          path: |
            *.ipa
            build/artifacts/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build_app
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ inputs.tag }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.ipa
            artifacts/**/*.apk
