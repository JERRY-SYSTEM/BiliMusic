name: bilimusic
description: "A premium Apple Music-inspired Bilibili audio player for Android & iOS."
publish_to: 'none'
version: 3.12.0+49

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.1.4
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  crypto: ^3.0.7
  image_picker: ^1.2.3
  file_picker: ^12.2.0
  qr_flutter: ^4.1.0
  hugeicons: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.2+1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
