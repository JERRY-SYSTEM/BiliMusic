name: bilibeat
description: "A premium Apple Music-inspired Bilibili audio player for Android & iOS."
publish_to: 'none'
version: 3.12.0+49

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  path_provider: ^2.1.6
  crypto: ^3.0.7
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
